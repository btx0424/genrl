[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genrl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.7",
    "mujoco>=3.15.0",
    "mujoco-warp>=3.15.0",
    "numpy>=2.5.4",
    # 1.18 needs a CUDA 13 driver and does not see the GPUs on driver 12.8.
    "warp-lang==1.15.0",
    "swanlab>=0.10.2",
    "torch-pointcloud>=0.0.15",
    "torch>=2.7",
    "uv>=0.13.0",
    "viser>=1.1.1",
    "yourdfpy>=0.0.60",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
